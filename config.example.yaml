app:
  theme: dark
  language: en

email:
  provider: smtp
  from: "sender@example.com"
  smtp:
    host: "localhost"
    port: 1025
    username: ""
    password: ""
    password_provider:
      type: keyring
      account: ""
      service: raditzlawliet.mecs
    tls: false
    batch_size: 50
  ses:
    region: "us-east-1"
    access_key_id: ""
    access_key_id_provider:
      type: keyring
      account: ""
      service: raditzlawliet.mecs
    secret_access_key: ""
    secret_access_key_provider:
      type: keyring
      account: ""
      service: raditzlawliet.mecs
    use_template: false # use SES template instead of inline subject/body
    template_name: "" # SES template name (required when use_template: true)
    batch_size: 1 # emails per SendBulkTemplatedEmail call (1-50)

worker:
  concurrency: 10
  max_retries: 3
  retry_backoff_base: "1s"
  retry_backoff_max: "30s"

log:
  campaign:
    log_to_file: true # write campaign events to logs/campaign_*.log
    verbose: false # include debug-level detail (per-email send/retry)
